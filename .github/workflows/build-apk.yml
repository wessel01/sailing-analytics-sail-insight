name: Build Sail Insight APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
          yarn install

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleLiveDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-live-debug
          path: android/app/build/outputs/apk/live/debug/app-live-debug.apk
